services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costos_user -d costos"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
    - web

  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: costos_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    labels:
      - "traefik.enable=true"

      # Router HTTPS
      - "traefik.http.routers.app.rule=Host(`app.nicorodriguez.com.ar`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"

      # Puerto interno de Next
      - "traefik.http.services.app.loadbalancer.server.port=3000"

    networks:
      - web

  migrate:
    build:
      context: .
      target: builder # Reutiliza la etapa 'builder'
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: costos_migrate
    command: pnpm prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  web:
    external: true
