services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro  # Para mantener hora correcta
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=America/Argentina/Buenos_Aires  # Cambia a tu zona horaria
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 5

    networks:
    - web

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_TITLE: ${NEXT_PUBLIC_APP_TITLE}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION}
        NEXT_PUBLIC_APP_LAUNCHED: ${NEXT_PUBLIC_APP_LAUNCHED}
    container_name: costos_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    labels:
      - "traefik.enable=true"

      # Router HTTPS
      - "traefik.http.routers.app.rule=Host(`app.nicorodriguez.com.ar`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"

      # Puerto interno de Next
      - "traefik.http.services.app.loadbalancer.server.port=3000"

    networks:
      - web

  migrate:
    build:
      context: .
      target: builder # Reutiliza la etapa 'builder'
    env_file:
      - .env
    container_name: costos_migrate
    command: pnpm prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

    networks:
      - web

  backup:
    image: postgres:16-alpine
    container_name: postgres_backup
    restart: "no"  # No reiniciar automáticamente, se ejecuta por cron
    env_file:
      - .env
    volumes:
      - /backups:/backups
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./scripts:/scripts:ro
    command: >
      sh -c "
        apk update && apk add --no-cache curl 2>&1 | grep -v 'fetch http'

        # Verificar instalación
        if command -v curl > /dev/null 2>&1; then
          echo '✅ curl instalado:'
          curl --version | head -1
        else
          echo '❌ No se pudo instalar curl'
          echo 'Continuando sin notificaciones...'
        fi

        echo '📋 Preparando scripts...'

        # Copiar scripts a /tmp
        mkdir -p /tmp/app-scripts
        cp -r /scripts/* /tmp/app-scripts/ 2>/dev/null

        if [ ! -f /tmp/app-scripts/backup/backup.sh ]; then
          echo '❌ ERROR: No se encontró backup.sh'
          echo 'Contenido de /scripts/:'
          ls -la /scripts/
          exit 1
        fi

        # Dar permisos de ejecución (forma SEGURA sin find problemático)
        echo '🔧 Dando permisos...'
        chmod +x /tmp/app-scripts/backup/backup.sh 2>/dev/null || true

        # También dar permisos a scripts de notificación si existen
        if [ -f /tmp/app-scripts/notify/telegram-notify.sh ]; then
          chmod +x /tmp/app-scripts/notify/telegram-notify.sh
        fi

        echo '✅ Scripts listos'
        echo '🚀 Ejecutando backup...'

        # Ejecutar backup
        cd /tmp/app-scripts/backup
        ./backup.sh
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    external: true
