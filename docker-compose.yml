services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro  # Para mantener hora correcta
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=America/Argentina/Buenos_Aires  # Cambia a tu zona horaria
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 5

    networks:
    - web

  app:
    build:
      context: .
    container_name: costos_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    labels:
      - "traefik.enable=true"

      # Router HTTPS
      - "traefik.http.routers.app.rule=Host(`app.nicorodriguez.com.ar`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"

      # Puerto interno de Next
      - "traefik.http.services.app.loadbalancer.server.port=3000"

    networks:
      - web

  migrate:
    build:
      context: .
      target: builder # Reutiliza la etapa 'builder'
    env_file:
      - .env
    container_name: costos_migrate
    command: pnpm prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

    networks:
      - web

  backup:
    image: postgres:16-alpine
    container_name: postgres_backup
    restart: "no"  # No reiniciar automáticamente, se ejecuta por cron
    env_file:
      - .env
    volumes:
      - /backups:/backups
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./scripts/backup/backup.sh:/scripts/backup.sh:ro
    command: >
      sh -c "
        if [ -f /scripts/backup.sh ]; then  # Y aquí también
          if [ -x /scripts/backup.sh ]; then
            echo '✅ Script encontrado y ejecutable'
            /scripts/backup.sh
          else
            echo '⚠️  Script no es ejecutable, intentando dar permisos...'
            chmod +x /scripts/backup.sh 2>/dev/null || echo 'No se pudo dar permisos'
            /scripts/backup.sh
          fi
        else
          echo '❌ ERROR: No se encontró /scripts/backup.sh'
          ls -la /scripts/ 2>/dev/null || echo 'Directorio /scripts/ no existe'
          exit 1
        fi
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    external: true
